id: DWW-SECRET-002
title: Cloud provider API key format
status: stable
category: secret_in_code
applies_to: [github_gist, github_code, github_events]
detection:
  selection:
    regex: 'AKIA[A-Z0-9]{16}'
  condition: selection
severity_base: 40
confidence_base: 0.85
attack: [T1552.001]
false_positives: [documentation examples with fake keys]
tests:
  positive: ['aws_access_key_id = AKIAIOSFODNN7EXAMPLE']
  negative: ['aws_access_key_id = YOUR_KEY_HERE']
playbook: secret_in_code
