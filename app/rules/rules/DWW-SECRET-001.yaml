id: DWW-SECRET-001
title: Private key in public content
status: stable
category: secret_in_code
applies_to: [github_gist, github_code, github_events]
detection:
  selection:
    regex: '-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
  condition: selection
severity_base: 40
confidence_base: 0.9
attack: [T1552.001, T1593.003]
false_positives: [test key files, example repositories]
tests:
  positive: ['-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEA']
  negative: ['-----BEGIN CERTIFICATE-----\nMIIE']
playbook: secret_in_code
