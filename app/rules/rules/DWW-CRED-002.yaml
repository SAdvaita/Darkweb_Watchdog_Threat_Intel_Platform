id: DWW-CRED-002
title: Corporate email and credential pair (semicolon separator)
status: stable
category: credential_leak
applies_to: [github_gist, github_code, github_events]
detection:
  selection:
    regex: '[A-Za-z0-9._+-]+@{{watchlist.domains}};[^ ]{6,}'
  condition: selection
severity_base: 40
confidence_base: 0.65
attack: [T1589.001, T1078]
false_positives: [CSV exports, documentation]
tests:
  positive: ['bob@acme.example;Autumn2023!']
  negative: ['user@other.example;test']
playbook: credential_leak
