name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx apscheduler sqlmodel pydantic \
            pydantic-settings pyyaml networkx stix2 reportlab aiofiles \
            cryptography pytest pytest-asyncio respx ruff

      - name: Lint with ruff
        run: ruff check app tests

      - name: Run all tests
        run: pytest tests/ -v --tb=short

      - name: Rule gate — all rules must have positive AND negative tests
        run: pytest tests/test_rules/ -v -k "positive or negative or rule"
